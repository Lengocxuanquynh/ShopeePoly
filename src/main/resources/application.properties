spring.application.name=Java5

# ===================================================================
# 1. CẤU HÌNH DATABASE H2 (Chạy ngay lập tức trên máy Mac/Win không cần bật SQL Server)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:java5;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# 2. CẤU HÌNH SQL SERVER (Khi bạn đã bật SQL Server, hãy bỏ dấu # ở các dòng dưới)
# ===================================================================
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=java5;encrypt=true;trustServerCertificate=true
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=sa
# spring.datasource.password=123456aA@
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Cấu hình Session Cookie (Không đính kèm ;jsessionid vào URL)
server.servlet.session.tracking-modes=cookie

# Cấu hình dung lượng upload ảnh sản phẩm
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB